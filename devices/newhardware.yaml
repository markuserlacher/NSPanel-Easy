substitutions:
  name: sample-esp32
  friendly_name: sample-esp32

  # Wi-Fi & Secrets
  wifi_ssid: ERLITHAI
  wifi_password: !secret wifi_password
  ota_password: !secret enspanel1__ota_password

  # Point to your repository fork
  ref_url: https://github.com/markuserlacher/NSPanel-Easy
  ref_name: main

  # Hardware Pin Overrides for custom eNSPanel board
  GPIO_DISPLAY_POWER_PIN:
    number: GPIO4
    inverted: true

  GPIO_RELAY_1_PIN: GPIO11
  GPIO_RELAY_2_PIN: GPIO12

  GPIO_DISPLAY_NEXTION_TX_PIN: GPIO5
  GPIO_DISPLAY_NEXTION_RX_PIN: GPIO6
  BAUD_RATE: "115200"

  GPIO_BUTTON_LEFT_PIN:
    number: GPIO42
    inverted: true
  GPIO_BUTTON_RIGHT_PIN:
    number: GPIO41
    inverted: true

  GPIO_TEMPERATURE_ADC_PIN: GPIO9

  # ESP32-S3 adaptations
  esp32_minimum_chip_revision: ""
  GPIO_PSRAM_CLK_PIN: "5"
  GPIO_PSRAM_CS_PIN: "18"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

packages:
  remote_package:
    url: https://github.com/markuserlacher/NSPanel-Easy
    ref: main
    files:
      - nspanel_esphome.yaml

logger:
  hardware_uart: UART0
  level: DEBUG

api:
  reboot_timeout: 0s
  encryption:
    key: 8Rl/lzEtbkOkqpF6XKaZbWwpsmzsKakF8IthFsRu09o=

wifi:
  output_power: 12dB

ota:
  - platform: esphome
    id: ota_esphome_1
    password: ${ota_password}

# Resistor override (not covered by substitution)
sensor:
  - id: !extend resistance_sensor
    resistor: 20kOhm